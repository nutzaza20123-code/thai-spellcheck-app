name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    env:
      # บังคับให้ Python ใช้ UTF-8 กับ stdio/console เสมอ (ป้องกัน UnicodeEncodeError
      # เวลาพิมพ์ข้อความไทยบน Windows console ที่ codepage อาจไม่ใช่ UTF-8)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke test the engine (import + tiny CLI run)
        run: python ci_smoke_test.py

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      - name: Verify EXE was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ThaiSpellCheckApp.exe")) {
            throw "Build did not produce dist/ThaiSpellCheckApp.exe"
          }
          Get-Item "dist/ThaiSpellCheckApp.exe" | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiSpellCheckApp-windows
          path: dist/ThaiSpellCheckApp.exe
          retention-days: 90
