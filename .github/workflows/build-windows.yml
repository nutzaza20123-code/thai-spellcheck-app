name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke test the engine (import + tiny CLI run)
        shell: pwsh
        run: |
          python -c "import spellcheck_engine; print('engine import OK')"
          python -c "
          from docx import Document
          d = Document()
          d.add_paragraph('การทดสอบระบบ ถูกต้องครบถ้วน')
          d.save('smoke_test.docx')
          "
          python spellcheck_engine.py smoke_test.docx --quiet
          echo "CLI smoke test OK"

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      - name: Verify EXE was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ThaiSpellCheckApp.exe")) {
            throw "Build did not produce dist/ThaiSpellCheckApp.exe"
          }
          Get-Item "dist/ThaiSpellCheckApp.exe" | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiSpellCheckApp-windows
          path: dist/ThaiSpellCheckApp.exe
          retention-days: 90
